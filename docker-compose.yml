version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: fx-postgres
    environment:
      POSTGRES_DB: fxtrading
      POSTGRES_USER: fxtrader
      POSTGRES_PASSWORD: fxtrader123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fx-network

  redis:
    image: redis:7-alpine
    container_name: fx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fx-network

  minio:
    image: minio/minio:latest
    container_name: fx-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9002:9000"   # API端口
      - "9003:9001"   # Web控制台端口
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - fx-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  fx-network:
    driver: bridge